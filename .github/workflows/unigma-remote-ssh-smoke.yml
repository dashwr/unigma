name: unigma remote SSH connection smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-ssh-smoke:
    name: remote SSH connection smoke in Ubuntu WSL2
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: prepare WSL paths
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          if ($workspace -notmatch '^([A-Za-z]):/(.+)$') {
            throw "Unsupported Windows workspace path: $env:GITHUB_WORKSPACE"
          }
          $drive = $matches[1].ToLowerInvariant()
          $path = $matches[2]
          $wslSource = "/mnt/$drive/$path"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_SOURCE=$wslSource`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_BUILD=/home/dasher/unigma-remote-ssh-smoke-build`n")

      # The smoke needs an sshd to connect to. This installs the binary in the
      # build environment only; the product is still forbidden by
      # docs/SSH-CONTRACT.md section 5 from installing or configuring sshd on any
      # remote host. The smoke does not use the packaged system service, its host
      # keys or its configuration: it starts its own sshd as an ordinary user, on
      # a high loopback port, with a disposable config and disposable keys.
      - name: install OpenSSH server in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-remote-ssh-sshd.sh'
          $script = @'
          set -euo pipefail
          if command -v sshd >/dev/null 2>&1 || [ -x /usr/sbin/sshd ]; then
            echo "sshd already present"
            exit 0
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends openssh-server
          test -x /usr/sbin/sshd
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user root -- bash $scriptPathWsl
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: install Node, compile extension and run smoke in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-remote-ssh-smoke.sh'
          $script = @'
          set -euo pipefail

          source="$1"
          build="$2"
          report="$source/.build/unigma-remote-ssh-smoke.txt"
          artifact="$HOME/.local/share/unigma-artifacts/unigma-server-latest"
          if [ ! -d "$artifact" ]; then
            echo "missing $artifact; run unigma-server-linux-artifact.yml first" >&2
            mkdir -p "$(dirname "$report")"
            printf 'check.artifact=fail\nsmoke=fail\n' > "$report"
            exit 1
          fi

          node_version="$(tr -d '[:space:]' < "$source/.nvmrc")"
          toolchain="$HOME/.local/share/unigma-toolchains/node-$node_version"
          if [ ! -x "$toolchain/bin/node" ]; then
            temporary="$(mktemp -d)"
            trap 'rm -rf "$temporary"' EXIT
            archive="node-v${node_version}-linux-x64.tar.xz"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error "https://nodejs.org/dist/v${node_version}/${archive}" --output "$temporary/$archive"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" --output "$temporary/SHASUMS256.txt"
            grep " ${archive}$" "$temporary/SHASUMS256.txt" > "$temporary/expected.sha256"
            (cd "$temporary" && sha256sum --check expected.sha256)
            mkdir -p "$toolchain"
            tar -xJf "$temporary/$archive" -C "$temporary"
            mv "$temporary/node-v${node_version}-linux-x64"/* "$toolchain"
            rm -rf "$temporary"
            trap - EXIT
          fi
          export PATH="$toolchain/bin:$PATH"
          node --version | grep -Fx "v$node_version"
          npm --version | grep -Ev '^(1[2-9]|[2-9][0-9])\.'

          rm -rf "$build"
          mkdir -p "$build"
          tar --exclude=.git --exclude=node_modules --exclude=.build -C "$source" -cf - . | tar -C "$build" -xf -
          git -C "$build" init --quiet
          cd "$build"
          node build/azure-pipelines/common/disableFoundryLocalInstall.ts
          npm ci --no-audit --no-fund
          node --experimental-strip-types ./node_modules/gulp/bin/gulp.js compile-extension:unigma-remote-ssh
          mkdir -p "$(dirname "$report")"
          node --experimental-strip-types build/unigma/smoke-remote-ssh.ts "$report"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: upload remote SSH smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unigma-remote-ssh-smoke-${{ github.run_id }}
          path: .build/unigma-remote-ssh-smoke.txt
          if-no-files-found: warn
          retention-days: 7
