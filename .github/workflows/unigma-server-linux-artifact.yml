name: build unigma Linux server artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build unigma-server Linux x64
    runs-on: self-hosted
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - name: checkout workflow ref
        uses: actions/checkout@v4

      - name: prepare WSL paths
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          if ($workspace -notmatch '^([A-Za-z]):/(.+)$') { throw "Unsupported Windows workspace path: $env:GITHUB_WORKSPACE" }
          $drive = $matches[1].ToLowerInvariant()
          $path = $matches[2]
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_SOURCE=/mnt/$drive/$path`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_OUTPUT=/mnt/$drive/$path/unigma-server-artifact`n")

      - name: build fixed unigma-server in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-build-server.sh'
          $script = @'
          set -euo pipefail

          source="$1"
          output="$2"
          commit="$3"
          node_version="$(tr -d '[:space:]' < "$source/.nvmrc")"
          toolchain="$HOME/.local/share/unigma-toolchains/node-$node_version"
          if [ ! -x "$toolchain/bin/node" ]; then
            temporary="$(mktemp -d)"
            trap 'rm -rf "$temporary"' EXIT
            archive="node-v${node_version}-linux-x64.tar.xz"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error "https://nodejs.org/dist/v${node_version}/${archive}" --output "$temporary/$archive"
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" --output "$temporary/SHASUMS256.txt"
            grep " ${archive}$" "$temporary/SHASUMS256.txt" > "$temporary/expected.sha256"
            (cd "$temporary" && sha256sum --check expected.sha256)
            mkdir -p "$toolchain"
            tar --no-same-owner --no-same-permissions -xJf "$temporary/$archive" -C "$temporary"
            mv "$temporary/node-v${node_version}-linux-x64"/* "$toolchain"
            rm -rf "$temporary"
            trap - EXIT
          fi
          export PATH="$toolchain/bin:$PATH"
          node --version | grep -Fx "v$node_version"
          npm --version | grep -Ev '^(1[2-9]|[2-9][0-9])\.'

          build_root="$HOME/.cache/unigma/server-build"
          mkdir -p "$build_root"
          echo "--- build filesystem ---"
          df -h "$build_root" /tmp
          build="$(mktemp -d -p "$build_root")"
          trap 'rm -rf "$build"' EXIT
          tar --exclude=.git --exclude=node_modules --exclude=.build -C "$source" -cf - . | tar --no-same-owner --no-same-permissions -C "$build" -xf -
          # The build copy has no .git, but postinstall and the build date task
          # both require a repository with a HEAD commit. Reuse the source commit
          # date so the generated build date stays deterministic.
          commit_date="$(git -C "$source" log -1 --format=%cI "$commit")"
          git -C "$build" init --quiet
          GIT_AUTHOR_DATE="$commit_date" GIT_COMMITTER_DATE="$commit_date" \
            git -C "$build" -c user.name='unigma ci' -c user.email='ci@unigma.invalid' \
            -c commit.gpgsign=false commit --quiet --allow-empty \
            --message="$commit" --no-verify
          cd "$build"
          export BUILD_SOURCEVERSION="$commit"
          export NODE_OPTIONS="--max-old-space-size=12288"
          export UV_THREADPOOL_SIZE=12
          export CMAKE_BUILD_PARALLEL_LEVEL=12
          export MAKEFLAGS=-j12
          node build/azure-pipelines/common/disableFoundryLocalInstall.ts

          # Compile the server's native addons against the vendored glibc 2.28 /
          # gcc 8.5 sysroot rather than the WSL distro toolchain.
          #
          # build/npm/postinstall.ts only honours a remote toolchain when the
          # VSCODE_REMOTE_* variables exist; otherwise it deletes CC and CXX and
          # node-gyp falls back to whatever compiler and headers the build host
          # happens to have. Run 33784052687 measured the consequence on a real
          # host: of eight packaged addons only one loaded, because the other
          # seven demanded GLIBC_2.38, GLIBCXX_3.4.31, CXXABI_1.3.15 and, for
          # node-pty, GLIBC_2.42. The baseline below is not a new policy: it is
          # what the shipped resources/server/bin/helpers/check-requirements-linux.sh
          # and src/vs/server/node/remoteAgentEnvironmentImpl.ts already promise.
          #
          # This mirrors the remote half of
          # build/azure-pipelines/linux/setup-env.sh instead of sourcing it. That
          # script keeps its VSCODE_REMOTE_* exports inside the same
          # `npm_config_arch == x64` branch that downloads clang and the libcxx
          # objects for the Electron client, so it cannot be sourced without also
          # paying for a client toolchain this workflow never uses.
          sysroot_root="$HOME/.local/share/unigma-toolchains/sysroots"
          mkdir -p "$sysroot_root"
          export VSCODE_REMOTE_SYSROOT_DIR="$sysroot_root/glibc-2.28-gcc-8.5.0"
          # getVSCodeSysroot checks the tarball against
          # build/checksums/vscode-sysroot.txt and writes a .stamp, so a repeated
          # dispatch reuses the extracted tree instead of downloading it again.
          VSCODE_SYSROOT_DIR="$VSCODE_REMOTE_SYSROOT_DIR" \
            VSCODE_SYSROOT_PREFIX="-glibc-2.28-gcc-8.5.0" \
            node -e 'import { getVSCodeSysroot } from "./build/linux/debian/install-sysroot.ts"; (async () => { await getVSCodeSysroot("amd64"); })()'

          remote_triple=x86_64-linux-gnu
          remote_sysroot="$VSCODE_REMOTE_SYSROOT_DIR/$remote_triple/$remote_triple/sysroot"
          export VSCODE_REMOTE_CC="$VSCODE_REMOTE_SYSROOT_DIR/$remote_triple/bin/$remote_triple-gcc"
          export VSCODE_REMOTE_CXX="$VSCODE_REMOTE_SYSROOT_DIR/$remote_triple/bin/$remote_triple-g++"
          export VSCODE_REMOTE_CXXFLAGS="--sysroot=$remote_sysroot"
          export VSCODE_REMOTE_LDFLAGS="--sysroot=$remote_sysroot -L$remote_sysroot/usr/lib/$remote_triple -L$remote_sysroot/lib/$remote_triple"
          # Assert the layout now. A missing compiler here would otherwise be
          # invisible: node-gyp would report success using the host toolchain and
          # the defect would only surface on the remote host again.
          test -x "$VSCODE_REMOTE_CC"
          test -x "$VSCODE_REMOTE_CXX"
          test -d "$remote_sysroot"

          # gcc 8.5 predates the -std=gnu++20 spelling and only accepts gnu++2a
          # for the same standard, so node-gyp needs the rewrite for every target
          # including the dependencies' own binding.gyp files. node-gyp reads this
          # path unconditionally, so restore whatever was there: the self-hosted
          # runner is shared with the client and OpenCode workflows.
          gyp_include="$HOME/.gyp/include.gypi"
          gyp_backup=""
          if [ -f "$gyp_include" ]; then
            gyp_backup="$(mktemp)"
            cp "$gyp_include" "$gyp_backup"
          fi
          restore_gyp_include() {
            if [ -n "$gyp_backup" ]; then
              mv -f "$gyp_backup" "$gyp_include"
            else
              rm -f "$gyp_include"
            fi
          }
          trap 'rm -rf "$build"; restore_gyp_include' EXIT
          mkdir -p "$HOME/.gyp"
          printf '%s\n' \
            "{" \
            "  \"target_defaults\": {" \
            "    \"conditions\": [" \
            "      [\"OS=='linux'\", {" \
            "        'cflags_cc!': [ '-std=gnu++20' ]," \
            "        'cflags_cc': [ '-std=gnu++2a' ]," \
            "      }]" \
            "    ]" \
            "  }" \
            "}" > "$gyp_include"

          npm ci --no-audit --no-fund
          echo "--- WSL memory before build ---"
          free -m
          build_log="$build/unigma-server-build.log"
          # Run the server build stage by stage so a stalled stage is identifiable
          # in the log instead of hiding inside one opaque aggregate task.
          run_stage() {
            echo "=== stage: $1 (started $(date -Is)) ==="
            stdbuf -oL -eL timeout --signal=TERM --kill-after=1m 75m \
              node --experimental-strip-types --max-old-space-size=12288 \
              ./node_modules/gulp/bin/gulp.js "$1" 2>&1 | stdbuf -oL tee -a "$build_log"
            local status="${PIPESTATUS[0]}"
            echo "=== stage: $1 (finished $(date -Is), status $status) ==="
            return "$status"
          }
          set +e
          gulp_status=0
          for stage in vscode-reh-linux-x64-min
          do
            run_stage "$stage"
            gulp_status=$?
            [ "$gulp_status" -eq 0 ] || break
          done
          set -e
          echo "--- gulp exit status: $gulp_status ---"
          echo "--- WSL memory after build ---"
          free -m
          if [ "$gulp_status" -ne 0 ]; then
            echo "--- kernel out-of-memory evidence (if any) ---"
            dmesg 2>/dev/null | tail -n 40 || echo "dmesg unavailable"
            exit "$gulp_status"
          fi
          server_root="$build/../vscode-reh-linux-x64"
          echo "--- packaged server tree ---"
          ls -la "$server_root" || { echo "server root missing at $server_root" >&2; ls -la "$build/.." >&2; exit 1; }
          ls -la "$server_root/bin" || true
          test -x "$server_root/bin/unigma-server"
          test -f "$server_root/LICENSE"
          node --experimental-strip-types "$source/build/unigma/audit-distribution.ts" --server "$server_root"

          # Refuse to package or publish a server whose native addons demand a
          # newer runtime than the package itself tells the user it needs. This
          # runs before the tarball and before the artifact store precisely
          # because both are consumed by the remote smokes: an artifact that
          # reaches the store has already been treated as usable. Invoked through
          # bash because the checkout lives on a Windows mount, where the
          # executable bit does not survive.
          bash "$source/build/unigma/verify-server-symbol-baseline.sh" "$server_root"

          rm -rf "$output"
          mkdir -p "$output/server"
          tar --owner=0 --group=0 -czf "$output/server/unigma-server.tar.gz" -C "$(dirname "$server_root")" "$(basename "$server_root")"
          cp "$server_root/LICENSE" "$output/LICENSE-unigma-server.txt"
          {
            printf 'source=unigma\n'
            printf 'commit=%s\n' "$commit"
            printf 'target=linux-x64\n'
            printf 'node=%s\n' "$node_version"
            printf 'serverArchive=server/unigma-server.tar.gz\n'
          } > "$output/PROVENANCE.txt"

          # Publish into the persistent WSL artifact store so a smoke run can pair
          # this server with a client build without rebuilding either one. The
          # store is invoked with bash because the checkout lives on a Windows
          # mount, where the executable bit does not survive.
          bash "$source/build/unigma/publish-latest-artifact.sh" \
            unigma-server "$server_root" "$commit" \
            target=linux-x64 "node=$node_version"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_OUTPUT $env:GITHUB_SHA
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: upload unigma-server Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: unigma-server-linux-x64-${{ github.sha }}
          path: unigma-server-artifact
          if-no-files-found: error
          retention-days: 7
