name: unigma remote SSH staging smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-staging-smoke:
    name: remote SSH staging smoke in Ubuntu WSL2
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: prepare WSL paths
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          if ($workspace -notmatch '^([A-Za-z]):/(.+)$') {
            throw "Unsupported Windows workspace path: $env:GITHUB_WORKSPACE"
          }
          $drive = $matches[1].ToLowerInvariant()
          $path = $matches[2]
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_SOURCE=/mnt/$drive/$path`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_BUILD=/home/dasher/unigma-remote-staging-smoke-build`n")

      # The smoke owns an ephemeral loopback sshd and never changes the product's
      # remote host. The server binary must already be available on the runner,
      # or the smoke deliberately creates a small synthetic equivalent.
      - name: compile extension and run staging smoke in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-remote-staging-smoke.sh'
          $script = @'
          set -euo pipefail

          source="$1"
          build="$2"
          report="$source/.build/unigma-remote-staging-smoke.txt"
          node_version="$(tr -d '[:space:]' < "$source/.nvmrc")"
          toolchain="$HOME/.local/share/unigma-toolchains/node-$node_version"
          if [ ! -x "$toolchain/bin/node" ]; then
            echo "missing Node $node_version toolchain" >&2
            mkdir -p "$(dirname "$report")"
            printf 'check.toolchain=fail\nsmoke=fail\n' > "$report"
            exit 1
          fi
          export PATH="$toolchain/bin:$PATH"
          command -v sshd >/dev/null 2>&1 || { echo "sshd is required on the self-hosted WSL runner" >&2; exit 1; }
          command -v ssh-keygen >/dev/null 2>&1 || { echo "ssh-keygen is required on the self-hosted WSL runner" >&2; exit 1; }
          command -v tar >/dev/null 2>&1 || { echo "tar is required on the self-hosted WSL runner" >&2; exit 1; }

          rm -rf "$build"
          mkdir -p "$build"
          tar --exclude=.git --exclude=node_modules --exclude=.build -C "$source" -cf - . | tar -C "$build" -xf -
          git -C "$build" init --quiet
          cd "$build"
          node build/azure-pipelines/common/disableFoundryLocalInstall.ts
          npm ci --no-audit --no-fund
          node --experimental-strip-types ./node_modules/gulp/bin/gulp.js compile-extension:unigma-remote-ssh
          node --experimental-strip-types build/unigma/smoke-remote-staging.ts "$report"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: upload remote staging smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unigma-remote-staging-smoke-${{ github.run_id }}
          path: |
            .build/unigma-remote-staging-smoke.txt
            .build/unigma-remote-staging-smoke.txt.ssh-trace.log
          if-no-files-found: warn
          retention-days: 7
