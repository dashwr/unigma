name: unigma remote SSH staging smoke

on:
  workflow_dispatch:
    inputs:
      run_as:
        description: >-
          WSL user that runs the smoke. Use root only as a rehearsal of the
          privileged path before touching a real host: the script restores
          ownership and modes differently as root, and no unprivileged run can
          expose that.
        type: choice
        options:
          - dasher
          - root
        default: dasher

permissions:
  contents: read

jobs:
  remote-staging-smoke:
    name: remote SSH staging smoke in Ubuntu WSL2 (${{ inputs.run_as || 'dasher' }})
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: prepare WSL paths
        env:
          RUN_AS: ${{ inputs.run_as }}
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          if ($workspace -notmatch '^([A-Za-z]):/(.+)$') {
            throw "Unsupported Windows workspace path: $env:GITHUB_WORKSPACE"
          }
          $drive = $matches[1].ToLowerInvariant()
          $path = $matches[2]
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_SOURCE=/mnt/$drive/$path`n")
          $runAs = if ($env:RUN_AS) { $env:RUN_AS } else { 'dasher' }
          if ($runAs -notin @('dasher', 'root')) { throw "Unsupported WSL user: $runAs" }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_RUN_AS=$runAs`n")
          # Each user builds in its own home, so a root rehearsal never leaves
          # root-owned files in the dasher home that later runs would trip over.
          $buildHome = if ($runAs -eq 'root') { '/root' } else { '/home/dasher' }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_BUILD=$buildHome/unigma-remote-staging-smoke-build`n")

      # The smoke owns an ephemeral loopback sshd and never changes the product's
      # remote host. The server binary must already be available on the runner,
      # or the smoke deliberately creates a small synthetic equivalent.
      - name: compile extension and run staging smoke in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-remote-staging-smoke.sh'
          $script = @'
          set -euo pipefail

          source="$1"
          build="$2"
          # The published artifacts live in the dasher home. A root rehearsal has a
          # different HOME, so the store is named explicitly instead of guessed.
          export UNIGMA_ARTIFACT_ROOT=/home/dasher/.local/share/unigma-artifacts
          report="$source/.build/unigma-remote-staging-smoke.txt"
          node_version="$(tr -d '[:space:]' < "$source/.nvmrc")"
          toolchain="/home/dasher/.local/share/unigma-toolchains/node-$node_version"
          if [ ! -x "$toolchain/bin/node" ]; then
            echo "missing Node $node_version toolchain" >&2
            mkdir -p "$(dirname "$report")"
            printf 'check.toolchain=fail\nsmoke=fail\n' > "$report"
            exit 1
          fi
          export PATH="$toolchain/bin:$PATH"
          command -v sshd >/dev/null 2>&1 || { echo "sshd is required on the self-hosted WSL runner" >&2; exit 1; }
          command -v ssh-keygen >/dev/null 2>&1 || { echo "ssh-keygen is required on the self-hosted WSL runner" >&2; exit 1; }
          command -v tar >/dev/null 2>&1 || { echo "tar is required on the self-hosted WSL runner" >&2; exit 1; }

          rm -rf "$build"
          mkdir -p "$build"
          # The source lives on a Windows mount, where every file reads as owned by
          # dasher. Extracting as root would restore that ownership inside /root,
          # and git then refuses the repository for dubious ownership.
          tar --exclude=.git --exclude=node_modules --exclude=.build -C "$source" -cf - . | tar --no-same-owner -C "$build" -xf -
          git -C "$build" init --quiet
          cd "$build"
          # postinstall runs `git config` with no scope, which needs a repository
          # in the current directory. As root the failure surfaced deep inside npm
          # as `fatal: not in a git directory`, so the precondition is asserted
          # here, with enough context to tell an ownership problem from a missing
          # repository.
          echo "diag.user=$(id -un) diag.uid=$(id -u) diag.git=$(git --version)"
          echo "diag.build_owner=$(stat -c '%U:%G' "$build")"
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "git repository missing or unusable in $build" >&2
            git rev-parse --git-dir || true
            exit 1
          fi
          node build/azure-pipelines/common/disableFoundryLocalInstall.ts
          npm ci --no-audit --no-fund
          node --experimental-strip-types ./node_modules/gulp/bin/gulp.js compile-extension:unigma-remote-ssh
          node --experimental-strip-types build/unigma/smoke-remote-staging.ts "$report"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user $env:WSL_RUN_AS -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: upload remote staging smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unigma-remote-staging-smoke-${{ github.run_id }}
          path: |
            .build/unigma-remote-staging-smoke.txt
            .build/unigma-remote-staging-smoke.txt.ssh-trace.log
          if-no-files-found: warn
          retention-days: 7
