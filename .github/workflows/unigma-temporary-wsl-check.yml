name: temporary WSL2 check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: inspect WSL2 on Windows runner
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: inspect WSL
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "runner=$env:RUNNER_NAME"
          $wsl = Get-Command wsl.exe -ErrorAction SilentlyContinue
          if ($null -eq $wsl) {
            Write-Host 'wsl.exe: unavailable'
            exit 0
          }

          Write-Host "wsl.exe=$($wsl.Source)"
          $status = @(wsl.exe --status 2>&1)
          $statusCode = $LASTEXITCODE
          $status | ForEach-Object { Write-Host $_ }
          Write-Host "status-exit=$statusCode"

          $version = @(wsl.exe --version 2>&1)
          $versionCode = $LASTEXITCODE
          $version | ForEach-Object { Write-Host $_ }
          Write-Host "version-exit=$versionCode"

          $distros = @(wsl.exe --list --verbose 2>&1)
          $distrosCode = $LASTEXITCODE
          $distros | ForEach-Object { Write-Host $_ }
          Write-Host "distros-exit=$distrosCode"

          exit 0
