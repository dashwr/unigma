name: unigma Linux WSL validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64-wsl-build:
    name: Linux x64 build in Ubuntu WSL2
    runs-on: self-hosted
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: prepare WSL paths
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          if ($workspace -notmatch '^([A-Za-z]):/(.+)$') {
            throw "Unsupported Windows workspace path: $env:GITHUB_WORKSPACE"
          }
          $drive = $matches[1].ToLowerInvariant()
          $path = $matches[2]
          $wslSource = "/mnt/$drive/$path"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_SOURCE=$wslSource`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_BUILD=/home/dasher/unigma-linux-build`n")
          Write-Host "WSL source: $wslSource"

      - name: install Linux dependencies and Node in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-bootstrap.sh'
          $script = @'
          set -euo pipefail

          source="$1"
          build="$2"
          sha="$3"
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          packages=(
            build-essential ca-certificates curl dpkg-dev fakeroot git
            libgbm1 libkrb5-dev libnotify-bin libnspr4 libnss3
            libsecret-1-dev libx11-dev libx11-xcb-dev libxkbfile-dev
            libxss1 pkg-config python3 xdg-utils xvfb xz-utils
          )
          add_apt_package() {
            local candidate version
            for candidate in "$@"; do
              version="$(apt-cache policy "$candidate" 2>/dev/null | awk '/Candidate:/ { print $2; exit }' || true)"
              if [ -n "$version" ] && [ "$version" != "(none)" ]; then
                packages+=("$candidate")
                return
              fi
            done
            echo "No installable APT candidate for: $*" >&2
            exit 1
          }
          add_apt_package libasound2t64 libasound2
          add_apt_package libatk-bridge2.0-0t64 libatk-bridge2.0-0
          add_apt_package libatk1.0-0t64 libatk1.0-0
          add_apt_package libatspi2.0-0t64 libatspi2.0-0
          add_apt_package libcairo2t64 libcairo2
          add_apt_package libcups2t64 libcups2
          add_apt_package libdbus-1-3t64 libdbus-1-3
          add_apt_package libexpat1t64 libexpat1
          add_apt_package libglib2.0-0t64 libglib2.0-0
          add_apt_package libgtk-3-0t64 libgtk-3-0
          add_apt_package libnotify4t64 libnotify4
          add_apt_package libpango-1.0-0t64 libpango-1.0-0
          add_apt_package libudev1t64 libudev1
          add_apt_package libx11-6t64 libx11-6
          add_apt_package libxcb1t64 libxcb1
          add_apt_package libxcomposite1t64 libxcomposite1
          add_apt_package libxdamage1t64 libxdamage1
          add_apt_package libxext6t64 libxext6
          add_apt_package libxfixes3t64 libxfixes3
          add_apt_package libxkbcommon0t64 libxkbcommon0
          add_apt_package libxkbfile1t64 libxkbfile1
          add_apt_package libxrandr2t64 libxrandr2
          apt-get install -y --no-install-recommends "${packages[@]}"

          node_version="$(tr -d '[:space:]' < "$source/.nvmrc")"
          node_prefix="/opt/node-v${node_version}-linux-x64"
          if [ ! -x "$node_prefix/bin/node" ]; then
            temporary="$(mktemp -d)"
            trap 'rm -rf "$temporary"' EXIT
            archive="node-v${node_version}-linux-x64.tar.xz"
            curl --fail --location --retry 3 --silent --show-error \
              "https://nodejs.org/dist/v${node_version}/${archive}" \
              --output "$temporary/$archive"
            curl --fail --location --retry 3 --silent --show-error \
              "https://nodejs.org/dist/v${node_version}/SHASUMS256.txt" \
              --output "$temporary/SHASUMS256.txt"
            grep " ${archive}$" "$temporary/SHASUMS256.txt" > "$temporary/expected.sha256"
            (cd "$temporary" && sha256sum -c expected.sha256)
            tar --no-same-owner --no-same-permissions -xJf "$temporary/$archive" -C /opt
            rm -rf "$temporary"
            trap - EXIT
          fi
          ln -sfn "$node_prefix" /opt/node-current
          export PATH="/opt/node-current/bin:$PATH"

          rm -rf "$build"
          mkdir -p "$build"
          tar --exclude=.git --exclude=node_modules --exclude=.build \
            -C "$source" -cf - . | tar --no-same-owner --no-same-permissions -C "$build" -xf -
          git -C "$build" init --quiet
          chown -R dasher:dasher "$build"

          printf 'node=%s\n' "$node_version"
          printf 'kernel=%s\n' "$(uname -r)"
          printf 'arch=%s\n' "$(uname -m)"
          printf 'commit=%s\n' "$sha"
          /opt/node-current/bin/node --version
          /opt/node-current/bin/npm --version
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user root -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD $env:GITHUB_SHA
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: install dependencies in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-npm-ci.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export PATH="/opt/node-current/bin:$PATH"
          export NODE_OPTIONS="--max-old-space-size=12288"
          export UV_THREADPOOL_SIZE=12
          export CMAKE_BUILD_PARALLEL_LEVEL=12
          export MAKEFLAGS=-j12
          export npm_config_fetch_retries=5
          export npm_config_fetch_retry_factor=2
          export npm_config_fetch_retry_mintimeout=10000
          export npm_config_fetch_retry_maxtimeout=120000
          cd "$build"
          node build/azure-pipelines/common/disableFoundryLocalInstall.ts
          for attempt in 1 2 3 4 5; do
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "npm ci failed after 5 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "npm ci failed on attempt $attempt; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: compile unigma extensions in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-runtime-test.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export PATH="/opt/node-current/bin:$PATH"
          export NODE_OPTIONS="--max-old-space-size=12288"
          export UV_THREADPOOL_SIZE=12
          export CMAKE_BUILD_PARALLEL_LEVEL=12
          export MAKEFLAGS=-j12
          cd "$build"
          node --experimental-strip-types --max-old-space-size=12288 ./node_modules/gulp/bin/gulp.js compile-extension:unigma-agent-runtime
          npm --prefix extensions/unigma-agent-runtime test
          # unigma-remote-ssh was never compiled here, and neither is it bundled,
          # so packaging listed its sources and shipped the extension without an
          # entry point: the remote SSH resolver could not load in any build. The
          # audit now refuses a package whose manifest names a file that is absent,
          # but the extension still has to be built for it to be there.
          node --experimental-strip-types --max-old-space-size=12288 ./node_modules/gulp/bin/gulp.js compile-extension:unigma-remote-ssh
          npm --prefix extensions/unigma-remote-ssh test
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: build Linux x64 package in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-build.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export BUILD_SOURCEVERSION="$2"
          export PATH="/opt/node-current/bin:$PATH"
          export NODE_OPTIONS="--max-old-space-size=12288"
          export UV_THREADPOOL_SIZE=12
          export CMAKE_BUILD_PARALLEL_LEVEL=12
          export MAKEFLAGS=-j12
          cd "$build"
          node --experimental-strip-types --max-old-space-size=12288 ./node_modules/gulp/bin/gulp.js vscode-linux-x64
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD $env:GITHUB_SHA
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: run workbench agent unit tests in WSL
        timeout-minutes: 10
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-workbench-test.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export PATH="/opt/node-current/bin:$PATH"
          cd "$build"
          # The unigmaAgent workbench suite had never run anywhere: the Linux job
          # ran the extension suites and the Windows job ran typecheck and the
          # build scripts, so the tests that guard the UI/runtime boundary and the
          # local integration policy were only ever executed by hand. They run
          # here, against out-build, because the package step just produced it and
          # compiling the client a second time would cost ten minutes to obtain a
          # tree the job already has.
          npm run test-node -- --build --runGlob "vs/workbench/contrib/unigmaAgent/test/common/*.test.js"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: audit Linux x64 package in WSL
        timeout-minutes: 2
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-audit-distribution.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export PATH="/opt/node-current/bin:$PATH"
          cd "$build"
           node --experimental-strip-types build/unigma/audit-distribution.ts "$build/../VSCode-linux-x64" "$build"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: run bundled OpenCode service smoke in WSL
        timeout-minutes: 5
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-opencode-service-smoke.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export PATH="/opt/node-current/bin:$PATH"
          cd "$build"
          mkdir -p .build/logs
          node --experimental-strip-types build/unigma/smoke-opencode-service.ts \
            "$build/../VSCode-linux-x64" \
            "$build/.build/logs/unigma-opencode-service-smoke.txt" | tee .build/logs/unigma-opencode-service-smoke.log
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: collect bundled OpenCode service smoke report
        if: always()
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-opencode-service-report.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          source="$2"
          mkdir -p "$source/.build/logs"
          for report in "$build"/.build/logs/unigma-opencode-service-smoke.*; do
            if [ -f "$report" ]; then
              cp -f "$report" "$source/.build/logs/"
            fi
          done
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD $env:WSL_SOURCE
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: verify bundled OpenCode in WSL
        timeout-minutes: 2
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-opencode-smoke.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export PATH="/opt/node-current/bin:$PATH"
          cd "$build"
          mkdir -p .build/logs
          node --experimental-strip-types build/unigma/smoke-opencode-bundle.ts "$build/../VSCode-linux-x64" | tee .build/logs/unigma-opencode-bundle-smoke.txt
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: run Linux desktop smoke test in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-smoke.sh'
          $script = @'
          set -euo pipefail
          build="$1"
          export PATH="/opt/node-current/bin:$PATH"
          export NODE_OPTIONS="--max-old-space-size=12288"
          cd "$build"
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            npm run smoketest -- --tracing --f '^(?!.*(?:Terminal Profiles|Chat)).*$'
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_BUILD $env:GITHUB_SHA
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: write Linux artifact evidence
        if: success()
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-artifact.sh'
          $script = @'
          set -euo pipefail
          source="$1"
          build="$2"
          sha="$3"
          runner="$4"
          artifact="$build/../VSCode-linux-x64"
          test -d "$artifact"
          mkdir -p "$source/.build/test-results" "$source/.build/logs"
          if [ -d "$build/test/smoke/test-results" ]; then
            cp -a "$build/test/smoke/test-results/." "$source/.build/test-results/"
          fi
          if [ -d "$build/.build/logs" ]; then
            cp -a "$build/.build/logs/." "$source/.build/logs/"
          fi
          tar -C "$artifact" -cJf "$source/.build/unigma-linux-x64.tar.xz" .
          # Publish into the persistent WSL artifact store so a smoke run can pair
          # this client with a server build without rebuilding either one. Only a
          # package that already passed the audit and the desktop smoke reaches
          # the store, because this step runs on success only.
          bash "$source/build/unigma/publish-latest-artifact.sh" \
            unigma "$artifact" "$sha" \
            target=linux-x64 build-environment='Ubuntu WSL2'
          cat > "$source/.build/unigma-linux-x64-evidence.txt" <<EOF
          commit=$sha
          target=linux-x64
          build-host=$runner
          build-environment=Ubuntu WSL2
          package=$artifact
          smoke=passed
          runtime-tests=passed
          EOF
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD $env:GITHUB_SHA $env:RUNNER_NAME
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      # Runs after the artifact is published on purpose: a baseline is a
      # measurement, not a gate, and a measurement that fails must not withhold
      # a package that already passed the audit and the smoke.
      - name: measure startup baseline in WSL
        if: success()
        timeout-minutes: 10
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-wsl-baseline.sh'
          $script = @'
          set -euo pipefail
          source="$1"
          build="$2"
          export PATH="/opt/node-current/bin:$PATH"
          cd "$build"
          mkdir -p "$source/.build/logs"
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            node --experimental-strip-types build/unigma/measure-baseline.ts \
              --exe "$build/../VSCode-linux-x64/unigma" \
              --scenario clean-profile \
              --out "$source/.build/logs/unigma-linux-baseline-clean-profile.txt"
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            node --experimental-strip-types build/unigma/measure-baseline.ts \
              --exe "$build/../VSCode-linux-x64/unigma" \
              --scenario idle-folder --folder "$build" \
              --out "$source/.build/logs/unigma-linux-baseline-idle-folder.txt"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unigma-linux-x64-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .build/unigma-linux-x64-evidence.txt
            .build/unigma-linux-x64.tar.xz
            .build/logs
            .build/test-results
