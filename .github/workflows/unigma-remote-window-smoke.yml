name: unigma remote window smoke

on:
  workflow_dispatch:
    inputs:
      alias:
        description: SSH config alias of the external VPS
        type: string
        required: true
        default: unigma-vps

permissions:
  contents: read

jobs:
  remote-window-smoke:
    name: remote window smoke in Ubuntu WSL2
    runs-on: self-hosted
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: prepare WSL paths
        env:
          VPS_ALIAS: ${{ inputs.alias }}
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          if ($workspace -notmatch '^([A-Za-z]):/(.+)$') { throw "Unsupported Windows workspace path: $env:GITHUB_WORKSPACE" }
          $drive = $matches[1].ToLowerInvariant()
          $path = $matches[2]
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_SOURCE=/mnt/$drive/$path`n")
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_BUILD=/home/dasher/unigma-remote-window-smoke-build`n")
          if (-not $env:VPS_ALIAS) { throw 'UNIGMA_VPS_ALIAS is required' }

      - name: stage server on VPS
        env:
          VPS_ALIAS: ${{ inputs.alias }}
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-remote-window-stage.sh'
          $script = @'
          set -euo pipefail
          source="$1"
          build="$2"
          alias="$3"
          if [ -z "$alias" ]; then echo 'UNIGMA_VPS_ALIAS is required' >&2; exit 2; fi
          export UNIGMA_VPS_ALIAS="$alias"
          export UNIGMA_ARTIFACT_ROOT=/home/dasher/.local/share/unigma-artifacts
          export UNIGMA_KEEP_STAGED=1
          report="$source/.build/unigma-remote-vps-staging-smoke.txt"
          node_version="$(tr -d '[:space:]' < "$source/.nvmrc")"
          toolchain="/home/dasher/.local/share/unigma-toolchains/node-$node_version"
          if [ ! -x "$toolchain/bin/node" ]; then echo "missing Node $node_version toolchain" >&2; exit 1; fi
          export PATH="$toolchain/bin:$PATH"
          rm -rf "$build"
          mkdir -p "$build"
          tar --exclude=.git --exclude=node_modules --exclude=.build -C "$source" -cf - . | tar --no-same-owner --no-same-permissions -C "$build" -xf -
          git -C "$build" init --quiet
          cd "$build"
          node build/azure-pipelines/common/disableFoundryLocalInstall.ts
          npm ci --no-audit --no-fund
          node --experimental-strip-types ./node_modules/gulp/bin/gulp.js compile-extension:unigma-remote-ssh
          node --experimental-strip-types build/unigma/smoke-remote-vps-staging.ts "$report"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD $env:VPS_ALIAS
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: open remote window under Xvfb
        if: success()
        env:
          VPS_ALIAS: ${{ inputs.alias }}
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-remote-window-smoke.sh'
          $script = @'
          set -euo pipefail
          source="$1"
          build="$2"
          alias="$3"
          export UNIGMA_VPS_ALIAS="$alias"
          export UNIGMA_ARTIFACT_ROOT=/home/dasher/.local/share/unigma-artifacts
          report="$source/.build/unigma-remote-window-smoke.txt"
          node_version="$(tr -d '[:space:]' < "$source/.nvmrc")"
          toolchain="/home/dasher/.local/share/unigma-toolchains/node-$node_version"
          if [ ! -x "$toolchain/bin/node" ]; then echo "missing Node $node_version toolchain" >&2; exit 1; fi
          export PATH="$toolchain/bin:$PATH"
          cd "$build"
          mkdir -p "$source/.build"
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            node --experimental-strip-types build/unigma/smoke-remote-window.ts "$report"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD $env:VPS_ALIAS
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: clean staged server from VPS
        if: always()
        env:
          VPS_ALIAS: ${{ inputs.alias }}
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-remote-window-cleanup.sh'
          $script = @'
          set -euo pipefail
          source="$1"
          build="$2"
          alias="$3"
          export UNIGMA_VPS_ALIAS="$alias"
          export UNIGMA_ARTIFACT_ROOT=/home/dasher/.local/share/unigma-artifacts
          report="$source/.build/unigma-remote-vps-cleanup.txt"
          mkdir -p "$source/.build"
          provenance=/home/dasher/.local/share/unigma-artifacts/unigma-server-latest/PROVENANCE.txt
          commit="$(awk -F= '$1 == "commit" { print $2; exit }' "$provenance" 2>/dev/null || true)"
          if [ -z "$commit" ] || [ ! -f "$build/extensions/unigma-remote-ssh/out/remoteServerTransport.js" ]; then
            printf 'cleanup=not-required\n' > "$report"
            exit 0
          fi
          export UNIGMA_VPS_COMMIT="$commit"
          cd "$build"
          node --experimental-strip-types build/unigma/clean-remote-vps.ts "$report"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_SOURCE $env:WSL_BUILD $env:VPS_ALIAS
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: upload remote window smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unigma-remote-window-smoke-${{ github.run_id }}
          path: |
            .build/unigma-remote-window-smoke.txt
            .build/unigma-remote-window-smoke.txt.workbench.log
            .build/unigma-remote-vps-staging-smoke.txt
            .build/unigma-remote-vps-cleanup.txt
          if-no-files-found: warn
          retention-days: 7
