name: unigma self-hosted validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: windows x64 build, smoke, and runtime contract
    runs-on: self-hosted
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: verify native build prerequisite
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio Installer was not found on the self-hosted runner.'
          }
          $spectreComponent = 'Microsoft.VisualStudio.Component.VC.14.50.18.0.x86.x64.Spectre'
          $latestSpectreComponent = 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre'
          $spectreInstallation = & $vswhere -latest -products * -requires $spectreComponent -property installationPath 2>$null | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($spectreInstallation)) {
            $spectreInstallation = & $vswhere -latest -products * -requires $latestSpectreComponent -property installationPath 2>$null | Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($spectreInstallation)) {
            throw 'Runner prerequisite missing: install Visual Studio Spectre-mitigated libraries as an administrator before running this workflow.'
          }
          $spectreInstallation = $spectreInstallation.Trim()
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "vs2022_install=$spectreInstallation`n")
          Write-Host "Using native toolchain at $spectreInstallation"
          Write-Host 'Visual Studio Spectre-mitigated libraries are installed.'

          $windowsSdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -Path $windowsSdkBin -Filter 'signtool.exe' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) {
            throw 'Runner prerequisite missing: Windows SDK x64 signtool.exe was not found.'
          }
          $signtoolDirectory = Split-Path $signtool.FullName -Parent
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$signtoolDirectory`n")
          Write-Host "Using Windows SDK SignTool at $($signtool.FullName)"

      - name: install dependencies
        run: npm ci --no-audit --no-fund

      - name: compile unigma extensions
        run: |
          npm run gulp compile-extension:unigma-agent-runtime
          npm --prefix extensions/unigma-agent-runtime test
          # Without this the extension is packaged from its sources and ships
          # without the entry point its manifest names, so the remote SSH resolver
          # cannot load. The Windows package had the same gap as the Linux one.
          npm run gulp compile-extension:unigma-remote-ssh
          # The suite is not run here. Several transport tests fail on Windows for
          # a real reason rather than a flaw in the tests: the transport is built
          # on OpenSSH ControlMaster, which Windows OpenSSH does not implement, so
          # remote SSH has no Windows path yet. That is a gap against the client
          # matrix in docs/SSH-CONTRACT.md and needs a design decision. Running a
          # suite that cannot pass would only train everyone to ignore red.

      - name: run focused upstream checks
        run: |
          npm run typecheck-client
          npm run test-build-scripts

      - name: build windows x64 package
        run: npm run gulp vscode-win32-x64

      - name: audit windows x64 package
        timeout-minutes: 2
        run: |
          $artifact = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'VSCode-win32-x64'
           node --experimental-strip-types build/unigma/audit-distribution.ts $artifact $env:GITHUB_WORKSPACE

      - name: run desktop smoke test
        # O smoke de núcleo não cobre Terminal Profiles nem Chat; essas suítes
        # ficam fora desta validação e não são suporte declarado por este job.
        run: npm run smoketest -- --tracing --f '^(?!.*(?:Terminal Profiles|Chat)).*$'

      - name: write artifact evidence
        run: |
          $artifact = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'VSCode-win32-x64'
          if (-not (Test-Path $artifact -PathType Container)) {
            throw "Build output not found: $artifact"
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE '.build') | Out-Null
          @(
            "commit=$(git rev-parse HEAD)"
            "platform=windows-x64"
            "runner=$env:RUNNER_NAME"
            "package=$artifact"
            "smoke=passed"
            "runtime-tests=passed"
          ) | Set-Content -Encoding utf8 (Join-Path $env:GITHUB_WORKSPACE '.build/unigma-win32-x64-evidence.txt')
          Compress-Archive -Path (Join-Path $artifact '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE '.build/unigma-win32-x64.zip') -CompressionLevel Fastest

      - name: upload windows evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unigma-windows-x64-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .build/unigma-win32-x64-evidence.txt
            .build/unigma-win32-x64.zip
            .build/logs
            test-results
            test/smoke/test-results
