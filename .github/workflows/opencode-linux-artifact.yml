name: build OpenCode Linux artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-opencode-linux-x64:
    name: build fixed OpenCode Linux x64
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      OPENCODE_COMMIT: c2eacd72afc4a4984564c393e15ab30011057269

    steps:
      - name: checkout Unigma workflow ref
        uses: actions/checkout@v4

      - name: prepare WSL paths
        run: |
          $workspace = $env:GITHUB_WORKSPACE.Replace('\', '/')
          if ($workspace -notmatch '^([A-Za-z]):/(.+)$') {
            throw "Unsupported Windows workspace path: $env:GITHUB_WORKSPACE"
          }
          $drive = $matches[1].ToLowerInvariant()
          $path = $matches[2]
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "WSL_OUTPUT=/mnt/$drive/$path/opencode-artifact`n")

      - name: build fixed OpenCode in WSL
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'unigma-build-opencode.sh'
          $script = @'
          set -euo pipefail

          output="$1"
          commit="$2"
          bun_version="1.3.14"
          toolchain="$HOME/.local/share/unigma-toolchains/bun-$bun_version"
          if [ ! -x "$toolchain/bin/bun" ]; then
            command -v curl >/dev/null 2>&1 || { echo "curl is required for verified Bun bootstrap" >&2; exit 1; }
            command -v python3 >/dev/null 2>&1 || { echo "python3 is required for verified Bun bootstrap" >&2; exit 1; }
            command -v sha256sum >/dev/null 2>&1 || { echo "sha256sum is required for verified Bun bootstrap" >&2; exit 1; }
            temporary="$(mktemp -d)"
            trap 'rm -rf "$temporary"' EXIT
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error \
              "https://api.github.com/repos/oven-sh/bun/releases/tags/bun-v$bun_version" \
              --output "$temporary/release.json"
            mapfile -t asset < <(python3 - "$temporary/release.json" <<'PY'
          import json
          import sys
          release = json.load(open(sys.argv[1], encoding='utf-8'))
          matches = [item for item in release.get('assets', []) if item.get('name') == 'bun-linux-x64.zip']
          if len(matches) != 1 or not isinstance(matches[0].get('digest'), str) or not matches[0]['digest'].startswith('sha256:'):
              raise SystemExit('expected Bun Linux x64 asset with SHA-256 digest is unavailable')
          print(matches[0]['browser_download_url'])
          print(matches[0]['digest'].removeprefix('sha256:'))
          PY
            )
            [ "${#asset[@]}" -eq 2 ] || { echo "invalid Bun release metadata" >&2; exit 1; }
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error "${asset[0]}" --output "$temporary/bun.zip"
            printf '%s  %s\n' "${asset[1]}" "$temporary/bun.zip" | sha256sum --check
            python3 - "$temporary/bun.zip" "$temporary/extracted" <<'PY'
          from pathlib import Path
          import sys
          import zipfile
          archive, destination = map(Path, sys.argv[1:])
          destination.mkdir()
          root = destination.resolve()
          with zipfile.ZipFile(archive) as bundle:
              for entry in bundle.infolist():
                  path = (root / entry.filename).resolve()
                  if root not in path.parents and path != root:
                      raise SystemExit('unsafe Bun archive path')
                  bundle.extract(entry, root)
          PY
            if [ ! -x "$temporary/extracted/bun-linux-x64/bun" ]; then
              echo "verified Bun archive has an unexpected layout" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$toolchain")"
            rm -rf "$toolchain"
            mv "$temporary/extracted/bun-linux-x64" "$toolchain"
            rm -rf "$temporary"
            trap - EXIT
          fi
          export PATH="$toolchain/bin:$PATH"
          bun --version | grep -Fx "$bun_version"

          source="$(mktemp -d)"
          trap 'rm -rf "$source"' EXIT
          git init --quiet "$source"
          git -C "$source" remote add origin https://github.com/anomalyco/opencode.git
          git -C "$source" fetch --depth 1 origin "$commit"
          git -C "$source" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$commit"

          cd "$source"
          bun install --frozen-lockfile
          bun run --cwd packages/opencode build -- --single --skip-install

          binary="packages/opencode/dist/opencode-linux-x64/bin/opencode"
          test -x "$binary"
          rm -rf "$output"
          mkdir -p "$output/bin"
          install -m 0755 "$binary" "$output/bin/opencode"
          install -m 0644 LICENSE "$output/LICENSE-opencode.txt"
          {
            printf 'source=https://github.com/anomalyco/opencode\n'
            printf 'commit=%s\n' "$commit"
            printf 'version=%s\n' "$(bun -e "console.log((await Bun.file('./packages/opencode/package.json').json()).version)")"
            printf 'license=MIT\n'
            sha256sum "$output/bin/opencode"
          } > "$output/PROVENANCE.txt"
          '@
          $script = $script -replace "`r`n?", "`n"
          [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
          $scriptPathWsl = "/mnt/$($scriptPath.Substring(0, 1).ToLowerInvariant())/$($scriptPath.Substring(3).Replace('\', '/'))"
          & wsl.exe -d Ubuntu --user dasher -- bash $scriptPathWsl $env:WSL_OUTPUT $env:OPENCODE_COMMIT
          $exitCode = $LASTEXITCODE
          Remove-Item -Force $scriptPath -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { exit $exitCode }

      - name: upload OpenCode Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64-c2eacd72
          path: opencode-artifact
          if-no-files-found: error
          retention-days: 7
